---

- name: "6.3.1.1 | PATCH | Ensure auditd packages are installed"
  when:
    - suse15cis_rule_6_3_1_1
    - "'audit' not in ansible_facts['packages']"
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.1.1
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - NIST800-53R5_SI-5
  ansible.builtin.package:
    name: audit
    state: present

- name: "6.3.1.2 | PATCH | Ensure auditing for processes that start prior to auditd is enabled"
  when:
    - suse15cis_rule_6_3_1_2
    - not system_is_container
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - grub
    - rule_6.3.1.2
  block:
    - name: "6.3.1.2 | PATCH | Ensure auditing for processes that start prior to auditd is enabled | Update setting if exists"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?:[^"\n]*[ \t])?audit=)(?!1[ \t"])[^ \t"\n]*'
        replace: '\g<1>1'
      notify: Grub update

    - name: "6.3.1.2 | PATCH | Ensure auditing for processes that start prior to auditd is enabled | Add setting if doesn't exist"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?!(?:[^"\n]*[ \t])?audit=)[^"\n]*?)[ \t]*"'
        replace: '\g<1> audit=1"'
      notify: Grub update

- name: "6.3.1.3 | PATCH | Ensure audit_backlog_limit is sufficient"
  when:
    - suse15cis_rule_6_3_1_3
    - not system_is_container
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - grub
    - rule_6.3.1.3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_SI-5
  block:
    - name: "6.3.1.3 | PATCH | Ensure audit_backlog_limit is sufficient | Update setting if exists"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?:[^"\n]*[ \t])?audit_backlog_limit=)(?!{{ suse15cis_audit_back_log_limit }}[ \t"])[^ \t"\n]*'
        replace: '\g<1>{{ suse15cis_audit_back_log_limit }}'
      notify: Grub update

    - name: "6.3.1.3 | PATCH | Ensure audit_backlog_limit is sufficient | Add setting if doesn't exist"
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^(GRUB_CMDLINE_LINUX="(?!(?:[^"\n]*[ \t])?audit_backlog_limit=)[^"\n]*?)[ \t]*"'
        replace: '\g<1> audit_backlog_limit={{ suse15cis_audit_back_log_limit }}"'
      notify: Grub update

- name: "6.3.1.4 | PATCH | Ensure auditd service is enabled and active"
  when:
    - suse15cis_rule_6_3_1_4
    - not system_is_container
  tags:
    - level2-server
    - level2-workstation
    - patch
    - auditd
    - rule_6.3.1.4
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_SI-5
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
